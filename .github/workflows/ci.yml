name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/devops-production-readiness

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate applications
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: junkitout_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: junkitout_agent_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: ci-only-jwt-secret-not-valid-outside-tests
      DATABASE_URL: postgresql://junkitout_test:ci_test_password@127.0.0.1:5433/junkitout_agent_test?schema=public
      DIRECT_URL: postgresql://junkitout_test:ci_test_password@127.0.0.1:5433/junkitout_agent_test?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Synchronize disposable CI database schema
        run: npx prisma db push --skip-generate

      - name: Run isolated tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: |
          npm run test:pg-agent-notifications
          npm run test:pg-agent-concurrency

      - name: Type-check main application
        run: npx tsc --noEmit --incremental false -p ./tsconfig.json

      - name: Type-check standalone admin application
        run: npx tsc --noEmit --incremental false -p ./apps/admin/tsconfig.json

      - name: Build main application
        run: npm run build

      - name: Build standalone admin application
        run: npm run build --prefix apps/admin
